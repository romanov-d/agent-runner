services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: runner
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runner -d runner']
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    environment:
      DATABASE_URL: postgres://runner:runner@db:5432/runner
      CONCURRENCY: 4
    depends_on:
      db: { condition: service_healthy }
    command: ['npm', 'run', 'worker']
    deploy:
      replicas: 2
